# nputer-index (C-07): code -> docs/architecture/graph.json.
# Deterministic tree-sitter TS/JS indexer; NO tauri dependency (ADR-015).
#
# Exact `=` pins (T-009 plan §5): the grammar crates compile vendored C via
# `cc` build scripts — the biggest supply-chain surface this crate adds. The
# verifier reviews these trees AT these versions; pins keep that review
# binding. Do not float them silently — a compile failure at exactly these
# versions is a stop-and-consult event.

[package]
name = "nputer-index"
version = "0.1.0"
description = "nputer-index (C-07): code -> docs/architecture/graph.json — deterministic tree-sitter TS/JS indexer, no tauri dependency (ADR-013/014/015, F-06)"
edition = "2021"
publish = false

# T-014: the small binary the future Node CLI shells out to (ADR-003/015).
# Named after the package so `cargo run -p nputer-index` and the installed
# name agree. Package selection keeps `tauri dev` safe: bare `cargo run`
# from app/src-tauri selects the ROOT package (nputer), never
# default-members, so this second workspace binary cannot reproduce the
# T-040 regression — probed empirically in a scratch workspace of exactly
# this shape (see implementation notes).
[[bin]]
name = "nputer-index"
path = "src/bin/nputer-index.rs"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tree-sitter = "=0.26.12"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
ignore = "=0.4.33"
blake3 = "=1.8.6"
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
# T-014 `--watch`: the ONE new dependency, and it adds zero PACKAGES to
# Cargo.lock — the app crate already depends on it at exactly this version
# (app/src-tauri/Cargo.toml, `notify-debouncer-mini = "0.7.0"`), so the lock
# gains one dependency EDGE and no new subtree. Exact-pinned per this
# crate's discipline. Chosen over a poll loop because the criterion asks
# for the SAME debounce semantics as the app watcher, and the app watcher
# IS this debouncer at DEBOUNCE = 250 ms (docs_watch.rs:48) — sharing the
# library is how the two watchers stay one behaviour instead of two.
notify-debouncer-mini = "=0.7.0"
