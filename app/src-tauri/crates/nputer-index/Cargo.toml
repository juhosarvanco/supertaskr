# nputer-index (C-07): code -> docs/architecture/graph.json.
# Deterministic tree-sitter TS/JS indexer; NO tauri dependency (ADR-015).
#
# Exact `=` pins (T-009 plan §5): the grammar crates compile vendored C via
# `cc` build scripts — the biggest supply-chain surface this crate adds. The
# verifier reviews these trees AT these versions; pins keep that review
# binding. Do not float them silently — a compile failure at exactly these
# versions is a stop-and-consult event.

[package]
name = "nputer-index"
version = "0.1.0"
description = "nputer-index (C-07): code -> docs/architecture/graph.json — deterministic tree-sitter TS/JS indexer, no tauri dependency (ADR-013/014/015, F-06)"
edition = "2021"
publish = false

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
tree-sitter = "=0.26.12"
tree-sitter-typescript = "=0.23.2"
tree-sitter-javascript = "=0.25.0"
ignore = "=0.4.33"
blake3 = "=1.8.6"
jsonc-parser = { version = "=0.33.1", features = ["serde"] }
