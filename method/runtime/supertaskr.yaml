# .supertaskr/supertaskr.yaml — role defaults and thresholds
# Task-file fields override these per task.

# THE MODEL PER ROLE IS READ FROM HERE, AND FROM NOWHERE ELSE (ADR-024
# decision 5). The arm resolves each dispatched seat's model out of this
# block, prints it in the brief and REFUSES the dispatch when a role it
# is filling has no default — it never falls back to whatever model the
# dispatching session happens to be running on, because a dispatch with
# no named model put all twenty-six reviewers of one measured run on the
# top tier. Opus 5 is the default for every role and these values are the
# user's to change: change them here and every dispatch after it changes.
roles:
  planner: claude-opus-5@subagent
  builder: claude-opus-5@subagent
  verifier: claude-opus-5@subagent   # resolver default: independent of builder — a fresh SESSION, never a cheaper model
  integrator: claude-opus-5@subagent
  janitor: claude-opus-5@subagent    # doc upkeep, commit messages

session_policy:
  default: fresh            # fresh unless a task names model@Sx
  warn_after_turns: 30      # sediment marker in the selector past this

rooms:
  max_rounds: 3             # then escalate to @human
  debate: independent_first # positions written before reveal

ceremony:
  S: [executor]
  M: [executor, verifier, integrator]
  L: [plan, executor, verifier, integrator]

# THE DISPATCH BLOCK DOES NOT LIVE HERE, AND THAT IS THE RECORD RATHER
# THAN AN OVERSIGHT (T-344). An owner's approval of a piece of work — the
# approval mode, the recovery policy and the GRANT that set them: who gave
# it, when, at which revision, the cards in dispatch order and each card's
# blob sha at approval — is an OPERATIONAL datum, and this file is a
# shipped code input. The parser's settings reader declares it, end-to-end
# bodies read it and the agent kit embeds it at compile time, so a grant
# written here costs a full code publication every time it is revised, and
# rides into every project the kit scaffolds carrying somebody else's
# authorization.
#
# SO THE ACTIVE GRANT LIVES IN ONE AUTHORITATIVE OPERATIONAL STORE at the
# ONE checkout designated to coordinate dispatch: an untracked
# `.supertaskr/dispatch-grant.yaml` holding the current authorization in
# exactly the block shape declared beside this file, with the superseded
# revisions in `.supertaskr/dispatch-grant-history.jsonl`. It is written
# by a command that validates, compares the revision AND the content it
# expects, writes atomically and retains history — and that runs no suite,
# makes no commit, pushes nothing and starts no CI run. Its whole shape is
# declared once in the schema beside this file, under `dispatch_block:`,
# and read there as one typed value by the parser library.
#
# A `dispatch:` BLOCK LEFT IN THIS FILE IS NOT READ AS AUTHORITY. The arm
# reports it as a stray and obeys the store; it neither refuses on it nor
# ignores it in silence.
#
# A CHECKOUT THAT HAS NEVER HELD A STORE IS THE EXPLICIT NO-GRANT STATE —
# approval each, recovery none, no grant, revision 0 — because no grant is
# ever created by guessing a person, an instant or a past authorization.
# An unverifiable store is a different thing again, and refuses.

# THE PROCESS IS SETTINGS (ADR-024 decision 6). Every step of the loop is
# a SWITCH, and every switch is DECLARED ONCE — in the schema beside this
# file, method/runtime/process-schema.yaml, with what it does, how it
# changes the loop, what it needs on, whether it may be turned off, which
# band measures it and what this project measured it to cost. This
# section carries no explanation of its own on purpose: a second copy is
# a copy that goes stale, and the schema is the ONE source the arm, the
# CLI, the app's settings screen and the skill all render.
#
# `profile:` is the column of that schema this project runs. `available:`
# is the whole set of columns, and the arm refuses when it and the schema
# disagree either way round. `switches:` holds the DEPARTURES only — an
# id the schema does not declare is refused, so is a value outside that
# switch's own set, and so is any override of a FLOOR switch. To see the
# switches this profile actually resolves to, with their costs and their
# constraints, ask the arm: it prints them in the dispatch brief and
# names the ones governing each step of a merge.
process:
  profile: standard
  available: [guarded-everything, standard, fast]
  switches:
    # This project departs from `standard` at NO switch today. That is a
    # fact about this project rather than a property of the schema, and
    # it is written as an empty block rather than left out so that a
    # reader can see the question was asked.
