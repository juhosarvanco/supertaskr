# .supertaskr/supertaskr.yaml — role defaults and thresholds
# Task-file fields override these per task.

# THE MODEL PER ROLE IS READ FROM HERE, AND FROM NOWHERE ELSE (ADR-024
# decision 5). The arm resolves each dispatched seat's model out of this
# block, prints it in the brief and REFUSES the dispatch when a role it
# is filling has no default — it never falls back to whatever model the
# dispatching session happens to be running on, because a dispatch with
# no named model put all twenty-six reviewers of one measured run on the
# top tier. Opus 5 is the default for every role and these values are the
# user's to change: change them here and every dispatch after it changes.
roles:
  planner: claude-opus-5@subagent
  builder: claude-opus-5@subagent
  verifier: claude-opus-5@subagent   # resolver default: independent of builder — a fresh SESSION, never a cheaper model
  integrator: claude-opus-5@subagent
  janitor: claude-opus-5@subagent    # doc upkeep, commit messages

session_policy:
  default: fresh            # fresh unless a task names model@Sx
  warn_after_turns: 30      # sediment marker in the selector past this

rooms:
  max_rounds: 3             # then escalate to @human
  debate: independent_first # positions written before reveal

ceremony:
  S: [executor]
  M: [executor, verifier, integrator]
  L: [plan, executor, verifier, integrator]

# THE DISPATCH BLOCK — WHERE AN OWNER'S APPROVAL LIVES, AND THIS PROJECT
# HAS NONE (T-319). A `dispatch:` block here records the approval mode
# (each, until a named card, standing), the recovery policy (none, or the
# repairs necessary to the approved work) and the GRANT that set them:
# who gave it, when, at which revision, the cards in dispatch order, and
# each card's blob sha at approval. Its whole shape is declared once in
# the schema beside this file, under `dispatch_block:`, and read there as
# one typed value by the parser library.
#
# THERE IS NO BLOCK HERE, AND THAT IS THE RECORD RATHER THAN AN OVERSIGHT.
# A reader that finds none answers the explicit NO-GRANT state — approval
# each, recovery none, no grant, revision 0 — because no grant is ever
# created by guessing a person, an instant or a past authorization. The
# standing authorization this project has been running under lives in the
# seat's ledger and in chat; it becomes a block here only through a
# migration grant the seat proposes verbatim and the owner approves
# (T-307), and never by a seat writing one down from memory. This is
# written as a comment rather than as an empty block for the same reason
# the empty `switches:` block below is written out at all: so that a
# reader can see the question was asked. An EMPTY `dispatch:` block is
# refused, because a block somebody emptied and a record nobody wrote are
# different things.
#
# AND IT CONTROLS NOTHING YET. Every row of the declaration is
# `declarative`: the block is readable configuration, and the arm admits
# and refuses nothing by it until T-324.

# THE PROCESS IS SETTINGS (ADR-024 decision 6). Every step of the loop is
# a SWITCH, and every switch is DECLARED ONCE — in the schema beside this
# file, method/runtime/process-schema.yaml, with what it does, how it
# changes the loop, what it needs on, whether it may be turned off, which
# band measures it and what this project measured it to cost. This
# section carries no explanation of its own on purpose: a second copy is
# a copy that goes stale, and the schema is the ONE source the arm, the
# CLI, the app's settings screen and the skill all render.
#
# `profile:` is the column of that schema this project runs. `available:`
# is the whole set of columns, and the arm refuses when it and the schema
# disagree either way round. `switches:` holds the DEPARTURES only — an
# id the schema does not declare is refused, so is a value outside that
# switch's own set, and so is any override of a FLOOR switch. To see the
# switches this profile actually resolves to, with their costs and their
# constraints, ask the arm: it prints them in the dispatch brief and
# names the ones governing each step of a merge.
process:
  profile: standard
  available: [guarded-everything, standard, fast]
  switches:
    # This project departs from `standard` at NO switch today. That is a
    # fact about this project rather than a property of the schema, and
    # it is written as an empty block rather than left out so that a
    # reader can see the question was asked.

# THE DISPATCH BLOCK (T-319, operational since T-324): the owner's approval
# as a datum a fresh seat in either harness inherits, migrated from the
# standing authorization of 2026-09-12 and the lane order ruled on
# 2026-09-14. Approval decisions may arrive in the owner's conversation;
# the seat records the approved grant and its later revisions here. A
# pause is honored when received and persisted in the runtime pause
# record (`.supertaskr/pause.json`, read by the arm; T-324-s1), not in
# this block; a revocation uses this block's `revoked` fields. An
# unrecorded instruction is not lost at succession.
#
# Membership in `order` is what the arm checks under every mode, standing
# included; standing means no per-card approval is spent and the grant
# runs until a pause. A derived repair needs a parent in this order and
# its failure evidence (recovery: repairs). The grant does not make a
# blocked card eligible, decide a reserved design question, or qualify a
# launch route; the ruled order, blockers and fences still apply.
#
# T-204 IS THE OWNER'S CALL: naming it here approves the dispatch of its
# pinned contract after its re-measure. If only the re-measure is meant,
# strike it from `order` and `cards` until the surviving work is decided.
# T-318 is left out while its design is open.
