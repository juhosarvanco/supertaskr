# method/runtime/process-schema.yaml — THE PROCESS AS SETTINGS, DECLARED
# ONCE (ADR-024 decision 6; the switch inventory in
# docs/rooms/loop-cost-and-speed.md is this file's input).
#
# Every step of the ceremony is a SWITCH here, and every switch is
# declared in exactly one place: this file. The runtime template beside
# it (supertaskr.yaml) names which PROFILE a project runs and any switch
# it departs from; it never repeats a switch's explanation, because a
# second copy is a copy that goes stale. The arm reads this file at
# dispatch and at merge, the CLI renders it, the app's settings screen
# renders it and the skill's command renders it — one source, four
# surfaces, and none of them is allowed to carry its own sentence about
# what a switch means.
#
# THE FIELDS, and each is a question a reader of a settings screen asks:
#   what     what the switch does, in one line
#   effect   how it changes the loop — what actually happens differently
#   reads    the arm symbol that consults it. A CITATION NAMES A SYMBOL,
#            NOT A LINE (docs/CONVENTIONS.md), so this is a function name
#            and never a line number. `processLedger` is the honest
#            answer for a switch no other arm branches on yet: the arm
#            still reads it, renders it and refuses when it goes missing.
#   needs    the constraints, as `<this value> => <other id>=<value>`;
#            `*` on the left means the need holds at every value, and a
#            `|` separates alternatives on either side. An unsatisfied
#            need is a FORBIDDEN COMBINATION and the arm refuses it
#            naming both switches and both values.
#   floor    whether it may be turned off. `true` is the room's floor:
#            no profile turns it off, and an override that tries is
#            refused. T-299 may refine the three profiles, never this.
#   band     which band measures it, by the band's own id in
#            tools/e2e/scripts/health-bands.config.mjs. An empty list is
#            "no band measures this yet" and `cost` says so.
#   cost     the project's own measured cost, from the room's table
#   implementation
#            WHAT MAKES THIS ROW TRUE, and it is the field that tells an
#            executable control from a recorded intention (T-299-s6).
#            `operational` — the arm READS this row and branches on it, so
#            changing the value changes what the arm does; the label is
#            earned by a body that changes the value and watches the arm
#            answer differently, never by a read site alone and never by a
#            surface printing the value back. `manual` — no program reads
#            the row and a person or a seat performs what it names;
#            `manualAction` is that instruction. `declarative` — the row is
#            a RECORD rather than a control: nothing reads its value and no
#            instruction is addressed to a seat by it, so editing it alone
#            changes nothing. **`declarative` DOES NOT MEAN THE BEHAVIOUR
#            IS ABSENT** — the fence hook, the docs gate and the landing
#            gate are all in force; what they are not is settings, because
#            they live in code and in CI configuration that never consults
#            this file. The terminal REFUSES to edit a declarative row for
#            exactly that reason: the write would move the template and
#            nothing else.
#   manualAction
#            the instruction that makes a MANUAL row true, in the
#            imperative and actionable enough to follow. Non-empty on a
#            manual row and empty on every other, and the parser refuses
#            both mistakes.
#   type     `toggle` or `choice`, with `values` its whole value set
#   profiles the value under each of the three profiles
#
# A PROFILE IS A COLUMN OF THIS TABLE, not a fourth thing to maintain:
# `guarded-everything` is the ceremony as it stood on 2026-09-09,
# `standard` is what ADR-024 ruled, and `fast` is `standard` with the
# whole-suite net nightly only and push batching on.

version: 1

profiles:
  guarded-everything: "the full-scale ceremony as it stood on 2026-09-09 — every card verified on the blind two-phase bench, the whole four suites at every push, and every regeneration and keeper done by a seat's hand"
  standard: "what ADR-024 ruled: three tiers chosen by the arm, one standing read, the arm merges, and the whole suite on a clock"
  fast: "standard with the whole-suite net nightly only and push batching on — the profile for a project whose CI minutes are the scarce thing"

# ── THE DISPATCH BLOCK OF THE RUNTIME TEMPLATE, DECLARED (T-319) ────
#
# The runtime template's `dispatch:` block is where the owner's approval
# of a piece of work LIVES: which cards were approved, at which revision
# of their own files, by whom, when, and whether the coordinator may
# dispatch the repairs that work turns out to need. It is declared HERE,
# once, for the same reason every switch above is — the template carries
# the VALUES and this file carries what they mean — and it is read by
# the parser library's `dispatchBlock` as ONE typed value validated
# against this declaration, never as a bag of strings each surface
# interprets for itself.
#
# THE BLOCK BECAME OPERATIONAL AT T-324, AND THE LABELS BELOW SAY WHICH
# ROWS. Under T-319 every row was `declarative`: the block was readable
# configuration and the arm admitted nothing and refused nothing by it.
# T-324 built the admission lifecycle on top of it, so the rows the arm
# BRANCHES ON now say `operational` — changing one of those values
# changes what a dispatch, a child start, a re-entry or a replacement
# writer does — and the rows that are a RECORD rather than a control
# still say `declarative`, which is the honest label for a field that is
# read, attributed and printed but decides nothing.
#
# THE READ SITES, AND A CITATION NAMES A SYMBOL, NOT A LINE. Each row
# below is read by the admission arm in `tools/e2e/scripts/dispatch-brief.mjs`
# at the symbol named here; the BLOCK as a whole is read by the parser
# library's `dispatchBlock`, which the `reads:` field above names, and the
# arm reaches it through that reader and through nothing else.
#
#   approval        admit             the three-mode branch
#   recovery        admit             the two-value branch
#   grant           grantState        the block's one current approval
#   grant.given_by  grantInheritance  attributed, never branched on
#   grant.at        grantInheritance  recorded, never branched on
#   grant.revision  admit             every admission binds to it
#   grant.order     admit             membership decides an admission
#   grant.until     admit             the endpoint the grant runs to
#   grant.cards     admit             the approved blob each admission binds to
#   revoked         admit             a revoked block has no current grant
#   revoked.at      admit             named in the refusal, never branched on
#   revoked.by      admit             named in the refusal, never branched on
#   limits          advisoryLimits    ADVISORY: read, reported, enforced by nothing
#   limits.tokens   advisoryLimits    ADVISORY
#   limits.expires_at advisoryLimits  ADVISORY — an expiry that has passed refuses nothing
#   history         grantState        validated by the reader; no arm branches on it
#
# **KEPT BY A BODY, NOT BY A MEMORY** (the guard-class map's own idiom):
# tools/e2e/tests/brief.spec.ts derives this table from these comment
# lines, requires every symbol named to be exported by the arm, and reds
# when an `operational` row has no read site named for it.
#
# AND THE BLOCK IS ABSENT UNTIL SOMEBODY GRANTS SOMETHING. A reader that
# meets no `dispatch:` block answers the explicit NO-GRANT state — the
# `absent:` value of each mode row and no grant at revision 0 — because
# no grant is ever created by guessing a person, an instant or a past
# authorization. An existing authorized way of working continues only
# through a migration grant the seat proposes verbatim and the owner
# approves (T-307).
#
# THE FIELDS OF A ROW, and each answers a question the reader asks:
#   required  `always` — required whenever the block is present;
#             `optional` — the container may be left out entirely;
#             `with-parent` — required when its own container is there;
#             `with-until` — required when `approval` is `until`, and
#             refused under every other mode.
#   shape     what the value IS, as this comment and the generated
#             reference say it. The set is closed and the reader
#             refuses a shape it does not know: `mode` (one of `values`),
#             `text`, `instant` (an ISO instant), `revision` (a positive
#             integer), `card-id`, `card-ids` (unique ids in order),
#             `card-blobs` (id -> the 40-hex blob sha of that card file
#             at approval), `token-ceilings` (provider -> a positive
#             integer), `map` (a container of its own rows) and `grants`
#             (earlier grants in order, each shaped like `grant`).
#             The reader answers each field it knows BY NAME, so a
#             shape edited here does not today move what the reader
#             accepts — T-319-s5 is that seam.
#   values    the whole value set of a `mode` row, empty on every other
#   absent    what the reader answers for this row when the block is
#             ABSENT — on a `mode` row, and empty on every other. The
#             no-grant state is DECLARED here rather than coded, so the
#             one place that says what "no grant" means is this file.
#   advisory  `true` where nothing in this tree enforces the field. The
#             limits are advisory by this card's own criterion: they are
#             recorded, rendered and validated, and nothing reads them to
#             stop anything.
#   implementation  as above — operational, manual or declarative
#   what      what the row records, in one line
dispatch_block:
  key: dispatch
  what: "the dispatch approval mode, the recovery policy, and the grant that sets them"
  effect: "a fresh seat in either harness inherits the owner's approval from the template rather than from a checkpoint's prose; a grant, a pause or a revocation is a dated edit to the block that appends the previous grant to its history and RAISES the revision, and which grant is current is decided by that revision and never by a date"
  reads: dispatchBlock
  fields:
    approval:
      required: always
      shape: mode
      values: [each, until, standing]
      absent: each
      advisory: false
      implementation: operational
      what: "when work STARTS — approval asked before every dispatch, a grant that runs up to and including a named card, or a standing grant that runs until a dated pause"
    recovery:
      required: always
      shape: mode
      values: [none, repairs]
      absent: none
      advisory: false
      implementation: operational
      what: "whether the coordinator may dispatch a correction round, a re-entry after a rejection or a repair the work discovers — none, or the repairs necessary to the approved work"
    grant:
      required: always
      shape: map
      values: []
      absent: ""
      advisory: false
      implementation: operational
      what: "the approval itself, as the owner gave it; a block that carries no grant is a block that records nothing"
    grant.given_by:
      required: with-parent
      shape: text
      values: []
      absent: ""
      advisory: false
      implementation: declarative
      what: "who gave the grant, as the record names them — the reader attributes a grant to this and promises no tamper prevention from an integer"
    grant.at:
      required: with-parent
      shape: instant
      values: []
      absent: ""
      advisory: false
      implementation: declarative
      what: "the ISO instant the grant was given, which is a record and never the tie-breaker between two grants"
    grant.revision:
      required: with-parent
      shape: revision
      values: []
      absent: ""
      advisory: false
      implementation: operational
      what: "the revision of this grant, a positive integer strictly above every revision in the history — and the ONE thing that decides which grant is current"
    grant.order:
      required: with-parent
      shape: card-ids
      values: []
      absent: ""
      advisory: false
      implementation: operational
      what: "the approved cards in dispatch order, each id once"
    grant.until:
      required: with-until
      shape: card-id
      values: []
      absent: ""
      advisory: false
      implementation: operational
      what: "the card the grant runs up to and including, which must belong to the order — required under `until` and refused under every other mode"
    grant.cards:
      required: with-parent
      shape: card-blobs
      values: []
      absent: ""
      advisory: false
      implementation: operational
      what: "each approved card at the revision it was approved AT — the 40-hex blob sha of its file — so that a card edited after the yes is a different card, keyed by exactly the ids the order names"
    revoked:
      required: optional
      shape: map
      values: []
      absent: ""
      advisory: false
      implementation: operational
      what: "the dated revocation of the grant, when there is one; a revoked block reads as NO CURRENT GRANT while the grant it revokes stays in the record"
    revoked.at:
      required: with-parent
      shape: instant
      values: []
      absent: ""
      advisory: false
      implementation: declarative
      what: "the ISO instant the grant was revoked"
    revoked.by:
      required: with-parent
      shape: text
      values: []
      absent: ""
      advisory: false
      implementation: declarative
      what: "who revoked it, as the record names them"
    limits:
      required: optional
      shape: map
      values: []
      absent: ""
      advisory: true
      implementation: declarative
      what: "the ceilings the grant was given under, recorded and enforced by NOTHING in this tree — the owner's ruling of 2026-09-13 is that this project's own loop runs without them"
    limits.tokens:
      required: with-parent
      shape: token-ceilings
      values: []
      absent: ""
      advisory: true
      implementation: declarative
      what: "a ceiling per provider, each a positive integer — ADVISORY: recorded and rendered, read by nothing that stops anything"
    limits.expires_at:
      required: with-parent
      shape: instant
      values: []
      absent: ""
      advisory: true
      implementation: declarative
      what: "the ISO instant the grant expires at — ADVISORY: recorded and rendered, read by nothing that stops anything"
    history:
      required: always
      shape: grants
      values: []
      absent: ""
      advisory: false
      implementation: declarative
      what: "every earlier grant in order, each shaped exactly like `grant` and each at a revision strictly below the current one; an empty list is the honest shape of a first grant"

switches:

  # ── WHAT EVERY SEAT READS ──────────────────────────────────────────
  read.standing:
    type: choice
    values: [five-documents-whole, state-and-index]
    what: "what every seat reads before working"
    effect: "at five-documents-whole every dispatched seat reads the five governing documents end to end before it can start; at state-and-index it reads STATE and the one-line index, and every other rule reaches it through its brief's context pack"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/token-budget-used]
    cost: "about 50K tokens per seat"
    implementation: manual
    manualAction: "every seat reads the standing set before it works: the root adapter names that set and each role file applies its own subtractions to it, so changing this value means editing the adapter and those role files"
    profiles:
      guarded-everything: five-documents-whole
      standard: state-and-index
      fast: state-and-index

  # ── DISPATCH ───────────────────────────────────────────────────────
  dispatch.keeper_at_base:
    type: toggle
    values: [off, on]
    what: "the fence's keeper spec run at the base before a lane is cut"
    effect: "on, the dispatch grades the keeper that pins the fenced property at the base and reports graded-and-green, graded-and-red or nothing-was-graded before a worktree exists; off, a lane is cut over a baseline nobody measured"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "1 to 3 min"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  dispatch.model_per_role:
    type: choice
    values: [by-hand, from-the-template]
    what: "the model of every dispatch read from the runtime template"
    effect: "at from-the-template the arm resolves each seat's model out of the template's roles block, prints it in row 1 and REFUSES a dispatch whose role has no default; at by-hand the arm names no model and the dispatching session's own is what a seat inherits"
    reads: roleModelRecs
    needs: ["from-the-template => template.roles=on"]
    floor: false
    band: [loop/token-budget-used]
    cost: "not measured — the model is the input the token band divides by, never a cost of its own"
    implementation: operational
    manualAction: ""
    profiles:
      guarded-everything: by-hand
      standard: from-the-template
      fast: from-the-template

  dispatch.ask_watcher:
    type: toggle
    values: [off, on]
    what: "the derived watcher over the live lanes' ask and report files"
    effect: "on, the seat's watcher is derived from the live lanes and fires on a NEW or a CHANGED ask file; off, a lane that parks a question waits for someone to remember it"
    reads: processLedger
    needs: []
    floor: false
    band: []
    cost: "not measured"
    implementation: manual
    manualAction: "after every dispatch derive the watch list from the live lanes and watch each lane's ask file, firing on a new file and on a CHANGED one; this repository publishes no watcher of its own"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  dispatch.preflight:
    type: toggle
    values: [on]
    what: "the card preflight at dispatch"
    effect: "the card's own claims are re-derived against the tree before a lane is cut, so a brief is never assembled over a figure that has moved"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  template.roles:
    type: toggle
    values: [on]
    what: "the runtime template's own roles block, which the model per role is read from"
    effect: "the block exists and names a model for every role the arm dispatches; without it the arm has nothing to resolve and refuses rather than inheriting the dispatching session's model"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: manual
    manualAction: "keep a roles block in the runtime template naming a model for every role the arm dispatches"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  # ── BUILD ──────────────────────────────────────────────────────────
  build.suites:
    type: choice
    values: [fence-owes, owed-set]
    what: "what the executor runs at its final commit"
    effect: "at fence-owes the lane runs every suite its fence touches, once; at owed-set it runs the set its own range owes, which is the smaller reading and the one the push and CI also take"
    reads: processLedger
    needs: ["* => push.token=on"]
    floor: false
    band: [loop/cycle-budget-used]
    cost: "5 to 15 min"
    implementation: manual
    manualAction: "the executor runs the suites this value names ONCE, at its final code-and-notes commit, through the blessed gate-runner, and reports each leg with its ref, its count and its exit"
    profiles:
      guarded-everything: fence-owes
      standard: owed-set
      fast: owed-set

  build.self_drill:
    type: choice
    values: [practised, required]
    what: "one mutant per new body, red, restored and proved, in the report"
    effect: "at required the executor's report carries a self-drill block and a report without one is incomplete; at practised the drill is a habit and a lane that skips it is discovered at the bench or not at all"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "minutes in the lane"
    implementation: manual
    manualAction: "the executor's report carries a self-drill block: one mutant per new body, planted where the property lives, shown red, restored, and the restore proved by hash"
    profiles:
      guarded-everything: practised
      standard: required
      fast: required

  build.criteria_echo:
    type: toggle
    values: [off, on]
    what: "the criteria restated as a checklist before coding"
    effect: "on, the executor writes the acceptance criteria back as a checklist before it touches anything, so a criterion it misread is caught while the cost of the miss is one paragraph"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "1 min"
    implementation: manual
    manualAction: "the executor restates every acceptance criterion as a checklist in the notes before it writes a line of the implementation"
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  build.preflight_before_stamp:
    type: toggle
    values: [off, on]
    what: "the card preflight on the executor's own prose"
    effect: "on, the lane's own implementation notes are re-derived before the verifying stamp, so prose that breaks the card's own claims is caught in the lane rather than at the merge"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "seconds"
    implementation: manual
    manualAction: "the executor re-derives the card's own claims over its finished notes and reaches a clean exit before it stamps the card verifying"
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  # ── VERIFY ─────────────────────────────────────────────────────────
  verify.tier:
    type: choice
    values: [guarded-for-every-card, by-the-classifier]
    what: "how a card is verified"
    effect: "at by-the-classifier the arm derives bounded, standard or guarded from the card's size, its fence against the guard-class list and whether a keeper already pins it; at guarded-for-every-card every card takes the blind two-phase bench whatever its size, which is the ceremony the room measured at 2.5 to 3.5 hours a card"
    reads: classifyTier
    needs: ["by-the-classifier => fence.hook=on", "by-the-classifier => push.token=on"]
    floor: false
    band: [loop/cycle-budget-used, loop/token-budget-used, loop/soft-verifier]
    cost: "the tiers' own budgets: 20 min and 80K bounded, 75 min and 310K standard, 100 min and 450K guarded"
    implementation: operational
    manualAction: ""
    profiles:
      guarded-everything: guarded-for-every-card
      standard: by-the-classifier
      fast: by-the-classifier

  verify.phase1:
    type: choice
    values: [by-the-seat, by-the-arm, "off"]
    what: "the tool-less attack set written from the card before the diff"
    effect: "at by-the-arm the arm renders phase 1 for the standard and guarded tiers and renders none for bounded; at by-the-seat the arm renders nothing and the seat writes the phase brief by hand; off, nothing is written before the diff exists and the verifier's blindness is spent"
    reads: phase1Owed
    needs: []
    floor: false
    band: [loop/token-budget-used]
    cost: "about 60K tokens, 4 min beside the build"
    implementation: operational
    manualAction: ""
    profiles:
      guarded-everything: by-the-seat
      standard: by-the-arm
      fast: by-the-arm

  verify.ground:
    type: choice
    values: [by-hand, by-a-script]
    what: "the ground truths at the base that phase 2 judges on"
    effect: "at by-a-script the arm takes the grounds and seals them, and the seat's further asks are answered by hand only on the guarded tier; at by-hand every ground is the seat's own measurement and the bench waits on it"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "10 to 15 min of the seat"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: by-hand
      standard: by-a-script
      fast: by-a-script

  verify.sealed_inputs:
    type: choice
    values: ["off", "on", standard-and-guarded]
    what: "the attack set and the grounds hashed and cited"
    effect: "sealed, the verdict cites a digest of what it judged on and a reader can re-derive it; unsealed, a verdict's inputs are whatever the session remembers"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/soft-verifier]
    cost: "seconds"
    implementation: manual
    manualAction: "hash the attack set and the ground truths taken at the base, and cite those digests in the verdict so a reader can re-derive what it judged on"
    profiles:
      guarded-everything: "on"
      standard: standard-and-guarded
      fast: standard-and-guarded

  verify.separate_bench:
    type: choice
    values: ["off", "on", standard-and-guarded]
    what: "phase 2 on a detached worktree at the tip"
    effect: "on, the verifier measures on a checkout of its own and the lane's worktree is never the bench; off, the verifier measures where the executor built and a dirty lane is indistinguishable from a defect"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "a worktree"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "on"
      standard: standard-and-guarded
      fast: standard-and-guarded

  verify.suites:
    type: choice
    values: [whole, owed-set, owed-set-except-guarded]
    what: "what the verifier runs at the tip"
    effect: "at whole the verifier grades the four legs end to end; at owed-set-except-guarded it grades the set the range owes and the guarded tier still takes the whole four"
    reads: processLedger
    needs: ["owed-set|owed-set-except-guarded => record.whole_suite_net=checkpoint-and-nightly|nightly"]
    floor: false
    band: [loop/cycle-budget-used]
    cost: "15 to 20 min, down to about 5"
    implementation: manual
    manualAction: "the verifier runs the suites this value names at the lane's tip and reports each with the ref it ran at and its body count"
    profiles:
      guarded-everything: whole
      standard: owed-set-except-guarded
      fast: owed-set-except-guarded

  verify.mutants:
    type: toggle
    values: [off, on]
    what: "data mutants where the property is data, code mutants for containment"
    effect: "on, a keeper is proved by planting the defect it claims to catch — and where the property lives in data, the mutant is a DATA mutant; off, a vacuous keeper is green and nobody knows"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/soft-verifier]
    cost: "inside phase 2"
    implementation: manual
    manualAction: "prove each keeper by planting the defect it claims to catch, and plant a DATA mutant wherever the property lives in data rather than in code"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  verify.corrections_as_bodies:
    type: toggle
    values: [off, on]
    what: "a correction is a body the verifier commits plus a mutant block"
    effect: "on, an assigned correction arrives as a committed body with the mutant that drills it, and the merge re-drills it RED ALONE; off, a correction is prose the integrator interprets"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/soft-verifier]
    cost: "not measured"
    implementation: manual
    manualAction: "the verifier commits each assigned correction as a body with the mutant block that drills it, rather than as prose for the integrator to interpret"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  verify.reads_notes_last:
    type: toggle
    values: [on]
    what: "the verifier reads the diff before the executor's notes"
    effect: "the diff is judged on its own before the lane's account of it, so the verifier's reading is not the executor's reading repeated back"
    reads: processLedger
    needs: []
    floor: true
    band: [loop/soft-verifier]
    cost: "not measured"
    implementation: manual
    manualAction: "the verifier judges the diff on its own before it reads the lane's implementation notes"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  # ── MERGE ──────────────────────────────────────────────────────────
  merge.by:
    type: choice
    values: [by-the-seat, by-the-arm]
    what: "who runs the merge ritual"
    effect: "at by-the-arm the merge verb performs the ritual step by step and STOPS with the merge staged, and the seat reads one line per step and rules; at by-the-seat every step is a command a session types and a step it forgets is a step nobody sees missing"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "15 to 21 min, down to about 5"
    implementation: manual
    manualAction: "run the merge through the arm's merge verb and rule on each step it stops at, rather than typing the ritual's steps by hand"
    profiles:
      guarded-everything: by-the-seat
      standard: by-the-arm
      fast: by-the-arm

  merge.redrill:
    type: choice
    values: [whole-spec, scoped]
    what: "the re-drill of the verdict's correction blocks"
    effect: "at scoped each mutant is re-drilled against the spec the fix diff touches; at whole-spec every block is re-drilled over the whole spec, which is the same answer for more minutes"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "minutes"
    implementation: manual
    manualAction: "re-drill each mutant block the newest verdict carries against the spec that block names, and stop on a survivor or on a body that reds more than itself"
    profiles:
      guarded-everything: whole-spec
      standard: scoped
      fast: scoped

  merge.regen_graph:
    type: choice
    values: [by-the-seat, by-the-arm]
    what: "the code graph regenerated when a source under the walk moved"
    effect: "at by-the-arm the regeneration, the currency check and the staging are steps in the merge plan with their own exits, and the dogfood pins run before the commit; at by-the-seat the plan carries a STOP naming what the seat owes and the regeneration happens off the ledger"
    reads: regenPlace
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "about 3 min when it fires"
    implementation: operational
    manualAction: ""
    profiles:
      guarded-everything: by-the-seat
      standard: by-the-arm
      fast: by-the-arm

  merge.regen_census:
    type: choice
    values: [by-the-seat, by-the-arm]
    what: "the behaviour census regenerated when a spec name moved"
    effect: "at by-the-arm the census regeneration and its staging are steps in the merge plan; at by-the-seat the plan carries a STOP naming what the seat owes"
    reads: regenPlace
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "about 1 min when it fires"
    implementation: operational
    manualAction: ""
    profiles:
      guarded-everything: by-the-seat
      standard: by-the-arm
      fast: by-the-arm

  merge.keepers:
    type: toggle
    values: [off, on]
    what: "the cheap keepers at the merge — the pinned-sentence, forbidden-content and diff-size checks"
    effect: "on, each is a step with its own exit before the commit; off, the merge plan carries the floor preflight alone and a reworded pinned sentence or a forbidden spelling lands and is found afterwards"
    reads: keeperSteps
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "seconds"
    implementation: operational
    manualAction: ""
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  merge.meters_to_bands:
    type: toggle
    values: [off, on]
    what: "the reports' meters appended to the bands at the merge"
    effect: "on, the lane's and the verifier's meters blocks are appended to the readings the bands parse; off, every report on the board carries a meters block that nobody reads"
    reads: processLedger
    needs: ["on => record.bands=on"]
    floor: false
    band: []
    cost: "seconds"
    implementation: manual
    manualAction: "hand the lane's and the verifier's reports to the merge, so their meters blocks reach the readings the bands parse"
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  merge.message:
    type: choice
    values: [by-the-seat, from-the-verdict]
    what: "the merge message"
    effect: "at from-the-verdict every sentence comes out of the verdict or out of a figure the run measured; at by-the-seat the message is a summary of what the session remembers, and a count that has moved is remembered wrong"
    reads: processLedger
    needs: []
    floor: false
    band: []
    cost: "not measured"
    implementation: manual
    manualAction: "take every sentence of the merge message out of the verdict or out of a figure the run measured"
    profiles:
      guarded-everything: by-the-seat
      standard: from-the-verdict
      fast: from-the-verdict

  # ── PUSH ───────────────────────────────────────────────────────────
  push.owed:
    type: choice
    values: [whole, owed-set]
    what: "what a push must have graded"
    effect: "at owed-set the push grades the set its own range owes, last, and the token keys on it; at whole the four legs run at every push"
    reads: processLedger
    needs: ["* => push.token=on"]
    floor: false
    band: [loop/cycle-budget-used]
    cost: "15 min, down to 1 to 5"
    implementation: manual
    manualAction: "grade the set the pushed range owes, last, and then push bare"
    profiles:
      guarded-everything: whole
      standard: owed-set
      fast: owed-set

  push.batching:
    type: toggle
    values: [off, on]
    what: "several merges per push"
    effect: "on, merges accumulate and one push carries them, which is fewer runs for the same tree; off, every merge is its own push and its own run"
    reads: processLedger
    needs: ["on => ci.per_push_runs=one"]
    floor: false
    band: [loop/cycle-budget-used]
    cost: "fewer CI runs"
    implementation: manual
    manualAction: "let merges accumulate and carry them in one push rather than pushing after each"
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  push.wait_previous_run:
    type: toggle
    values: [off, on]
    what: "the guard refuses a push while a run is in flight"
    effect: "on, a push waits for the previous run to conclude; off, the guard ANNOUNCES the newest concluded verdict at every push and the reading stays the seat's"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "up to 35 min"
    implementation: manual
    manualAction: "read the verdict the push guard announces before pushing, and at on wait for the run in flight to conclude first"
    profiles:
      guarded-everything: "on"
      standard: "off"
      fast: "off"

  push.token:
    type: toggle
    values: [on]
    what: "the owed-set token and the push guard"
    effect: "a push is refused unless the set its range owes has been graded and the token keys on that tree; a commit or a staged merge during the run unkeys it"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  # ── CI ─────────────────────────────────────────────────────────────
  ci.owed:
    type: choice
    values: [everything, owed-set]
    what: "what CI runs per push"
    effect: "at owed-set the runner grades the set the pushed range owes; at everything it grades the four legs at every push"
    reads: processLedger
    needs: ["owed-set => record.whole_suite_net=checkpoint-and-nightly|nightly"]
    floor: false
    band: [loop/cycle-budget-used]
    cost: "34 min, down to about 10"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: everything
      standard: owed-set
      fast: owed-set

  ci.sharding:
    type: toggle
    values: [off, on]
    what: "the e2e lane split across runners by owning spec"
    effect: "on, the longest leg is several jobs and the wall clock is the slowest shard; off, it is one job and the wall clock is the sum"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "21 min, down to about 5"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  ci.regen_check:
    type: toggle
    values: [off, on]
    what: "graph and census currency checked on the runner"
    effect: "on, a merge that forgot a regeneration reds on a machine that is not the seat's; off, a stale generated file travels until someone asks the gate by hand"
    reads: processLedger
    needs: []
    floor: false
    band: []
    cost: "seconds"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  ci.per_push_runs:
    type: choice
    values: [one, per-merge]
    what: "how many runs a push starts"
    effect: "at one, a push carrying several merges starts one run and that run is the reading for the whole batch; at per-merge each merge is separately visible and batching cannot be told from a lost run"
    reads: processLedger
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "one run per push"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: per-merge
      standard: one
      fast: one

  # ── RECORD ─────────────────────────────────────────────────────────
  record.whole_suite_net:
    type: choice
    values: [every-push, checkpoint-and-nightly, nightly]
    what: "when the whole four suites run"
    effect: "the net under every switch that grades less than everything: at checkpoint-and-nightly the four legs run at every checkpoint and nightly in CI, and a red there is filed against the merge that caused it; at every-push there is no net because nothing is ever skipped"
    reads: wholeSuiteNet
    needs: []
    floor: false
    band: [loop/cycle-budget-used]
    cost: "15 min per run"
    implementation: manual
    manualAction: "run the four legs end to end on the clock this value names: the integrating seat takes the checkpoint half and the scheduled run takes the nightly one"
    profiles:
      guarded-everything: every-push
      standard: checkpoint-and-nightly
      fast: nightly

  record.bands:
    type: toggle
    values: [off, on]
    what: "cycle time and tokens per size and tier, with budgets"
    effect: "on, every lane's readings land in the bands and a tier drifting past its budget is visible at the next checkpoint; off, the budgets are numbers in an ADR"
    reads: processLedger
    needs: []
    floor: false
    band: []
    cost: "seconds"
    implementation: manual
    manualAction: "record each lane's readings in the bands' own file at the merge, and read the bands at every checkpoint"
    profiles:
      guarded-everything: "off"
      standard: "on"
      fast: "on"

  record.checkpoint:
    type: toggle
    values: [on]
    what: "the record and STATE regenerated at a sitting"
    effect: "the sitting's record is written and STATE is replaced from its template in the same commit, so the handoff baton is never a commit behind the tree"
    reads: processLedger
    needs: []
    floor: true
    band: [loop/cycle-budget-used]
    cost: "20 min per sitting"
    implementation: manual
    manualAction: "write the sitting's record and replace STATE from its template in the same commit"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  # ── THE REST OF THE FLOOR ──────────────────────────────────────────
  fence.hook:
    type: toggle
    values: [on]
    what: "the lane fence and the write hook that keeps it"
    effect: "a lane may write only what its card fenced, and the hook refuses the write rather than reporting it afterwards"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  landing.gate:
    type: toggle
    values: [on]
    what: "the landing gate"
    effect: "a merge onto the integration branch is judged before it lands, and a card is resolved by the branch at the merge's second parent"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  docs.gate:
    type: toggle
    values: [on]
    what: "the docs gate"
    effect: "a path under docs/ is a CODE INPUT, and the gate names which suites a change to it owes — the trigger no other gate can see"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: declarative
    manualAction: ""
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  method.stamp:
    type: toggle
    values: [on]
    what: "the method stamp and its eval gate when method text moves"
    effect: "a merge that moves method text bumps the stamp in every file that carries it and runs the method evals; a half bump reds the pin"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: manual
    manualAction: "bump the method stamp in every file that carries it, and run the method evals, in the merge that moves method text"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"

  record.immutable:
    type: toggle
    values: [on]
    what: "records never rewritten"
    effect: "a checkpoint, a verdict and a room entry are appended to and never edited, so the record of what was believed at a moment survives the belief"
    reads: processLedger
    needs: []
    floor: true
    band: []
    cost: "seconds"
    implementation: manual
    manualAction: "append to a checkpoint, a verdict or a room entry; never edit one"
    profiles:
      guarded-everything: "on"
      standard: "on"
      fast: "on"
