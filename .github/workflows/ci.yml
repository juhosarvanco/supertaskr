# T-020: the repo's one CI job — a thin invoker of the CONVENTIONS-
# verbatim per-package commands (docs/CONVENTIONS.md "Build & test" is
# the one source of truth; tools/e2e/tests/workflow-parity.spec.ts pins
# validity, command parity, SHA pins, and the xvfb boot step, so drift
# between this file and CONVENTIONS fails the lane).
#
# Committed COMPLETE and DORMANT: no remote exists today (plan §1). It
# activates at the repo's first GitHub push — the Linux halves of
# T-001/T-003's criteria close at that activation and remain honestly
# open until it. First run to watch: the full job, and specifically the
# three T-018 sentinel live tests inside `cargo test` — ubuntu's inotify
# watches inodes, the first backend where replaced-wholesale /
# deleted-recreated handles can actually die (T-018-s3 fold).
#
# Every `uses:` is pinned by full commit SHA (tag noted beside it).
name: ci

# LEAST PRIVILEGE for the one credential this workflow carries (T-036 —
# ADR-012's discipline applied to CI: the minimum is the default, and
# every addition is argued in place). This job checks out, installs,
# builds, runs three suites, lints, audits, runs the E2E lane and boots
# under xvfb — it writes nothing back, opens no PR, uploads nothing, so
# `contents: read` is the whole of what GITHUB_TOKEN needs. Declared
# here because WITHOUT this block the token's scope is whatever the
# repository's default workflow-permission setting says: a checkbox in a
# web UI, not a fact in this repo (the machine-local invisible input
# T-009 §3 exterminated from the graph).
#
# THE RULE, at the point of temptation: WHEN a future step genuinely
# needs more, add the grant at THAT JOB's scope with its reason recorded
# beside it — a `permissions:` key on the job that needs it, naming
# `contents: read` plus the one extra scope — and NEVER by widening this
# workflow default, which would hand the extra scope to every job and
# every step in the file. tools/e2e/tests/workflow-permissions.spec.ts
# fails loudly on any widening, top-level or per-job, in THIS file or any
# other workflow (T-045 generalised the rule off ci.yml's hard-coded
# path). A genuinely needed grant is argued twice — here, and as a row in
# that spec's EXCEPTIONS table carrying file, scope and reason. The
# failure is the conversation, not an obstacle to route around.
permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, not depth 1: three e2e specs READ the repository's
          # own git history as their input (brief.spec's two-Checkpoint read,
          # range-rule's `<hash>^` parent walks, docs-input-gate's range
          # scenarios), and a shallow clone hands them a repository that has
          # exactly one commit — CI run 33259394002, the e2e lane's first
          # Linux contact, redded all three exactly this way.
          fetch-depth: 0

      - name: Linux prerequisites (Tauri v2 webkit2gtk set + xvfb)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            lib/parser/package-lock.json
            app/package-lock.json
            tools/e2e/package-lock.json

      - name: Record rust toolchain (runner-preinstalled stable, no third-party action)
        run: rustc --version && cargo --version

      - name: Cache cargo + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            app/src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('app/src-tauri/Cargo.lock') }}

      - name: Cache playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tools/e2e/package-lock.json') }}

      # ---- token lint (zero-dep; runs before any install) --------------
      # T-054 (T-045-s1): the DOCUMENTED command, not a second spelling of
      # it. `npm run` needs no installed node_modules — it only extends
      # PATH — so this still runs ahead of every `npm ci`, and the script
      # is plain node with no deps. Still two steps, because `--selftest`
      # short-circuits the walk. The `--` is load-bearing: npm eats a bare
      # flag after a script name (T-046, measured on npm 11.12.1).
      - name: Token lint selftest
        working-directory: tools/e2e
        run: npm run lint:tokens -- --selftest
      - name: Token lint
        working-directory: tools/e2e
        run: npm run lint:tokens

      # ---- lib/parser (ADR-011 order: parser before app) ---------------
      - name: parser install
        working-directory: lib/parser
        run: npm ci
      - name: parser suite
        working-directory: lib/parser
        run: npx vitest run
      - name: parser types
        working-directory: lib/parser
        run: npx tsc --noEmit
      - name: parser build
        working-directory: lib/parser
        run: npm run build

      # ---- app ----------------------------------------------------------
      - name: app install
        working-directory: app
        run: npm ci
      - name: app build
        working-directory: app
        run: npm run build
      - name: app suite
        working-directory: app
        run: npm test

      # ---- rust workspace ----------------------------------------------
      - name: cargo suite (both workspace crates; incl. the T-018 sentinel live tests)
        working-directory: app/src-tauri
        run: cargo test

      # ---- graph currency (T-054) --------------------------------------
      # THE GATE THIS JOB NEVER HAD. Bare `cargo test` above SKIPS
      # `#[ignore]`d tests, and `self_graph_is_current` — the only
      # byte-comparison against the committed docs/architecture/graph.json
      # — is `#[ignore]`d on purpose, so local `cargo test` stays hermetic
      # to unrelated TypeScript edits. Until this step existed a stale
      # graph passed CI green: the dogfood fixtures assert against the
      # COMMITTED graph, and a stale graph agrees perfectly with fixtures
      # that match it. Twenty-nine regens were held up by a written ritual
      # and conscientious integrators, nothing else.
      #
      # Exit 1 = STALE (regenerate: SUPERTASKR_UPDATE_GOLDEN=1 cargo test -p
      # supertaskr-index --test self_graph -- --ignored). 3 = the gate could
      # not run. `--root ../..` is NOT a CI adaptation: without it the
      # root defaults to the current directory and the check reports the
      # graph MISSING and exits 1, a false red that reads like staleness.
      - name: graph currency (supertaskr-index index --check)
        working-directory: app/src-tauri
        run: cargo run -p supertaskr-index -- index --check --root ../..

      # ---- advisory audit (T-009-s3): dev tool, never a repo dep -------
      # HARD fail on an advisory against the exact pins — a red run with
      # no code change is the FEATURE (deliberate re-pin + re-review at
      # the stop-and-consult gate), never continue-on-error. Fetches the
      # RUSTSEC advisory DB — the one network-touching step.
      - name: install cargo-audit
        working-directory: app/src-tauri
        # Idempotent on purpose (T-153-s13): the cargo cache saves
        # ~/.cargo/bin, so the run AFTER the first install restores the
        # binary and a bare `cargo install` refuses with "binary already
        # exists" — which stopped every run on this Cargo.lock, main
        # pushes included, at this step. A restored binary is the happy
        # path, not an error.
        run: command -v cargo-audit >/dev/null 2>&1 || cargo install cargo-audit --locked
      - name: cargo audit
        working-directory: app/src-tauri
        run: cargo audit

      # ---- real-input E2E lane -----------------------------------------
      - name: e2e install
        working-directory: tools/e2e
        run: npm ci

      # ---- docs gate (T-090) -------------------------------------------
      # THE THIRD STANDING GATE, ARRIVING AS A STEP. `docs/` is a CODE
      # INPUT and neither of the other two triggers can see it: a commit
      # whose whole diff is `docs/tasks/*.md` matches neither, and twice
      # such a commit turned a suite red — 9c64cd8 (two card titles opened
      # with a backtick, so two cards stopped parsing and a
      # scroll-containment body reported Expected "60") and fede266 (a
      # `status:` outside the parser's vocabulary took the app suite to
      # 830 of 831). Both were found three layers from the cause.
      #
      # It runs the WHOLE-TREE half — every live card's frontmatter, the
      # root-anchor account, the unlinkable-reader tripwire — and judges NO
      # diff: a workflow has no "merge's diff" to be handed, and this gate
      # deliberately computes no range of its own. The DIFF half stays the
      # integrator's hand run, spelled in CONVENTIONS' DOCS GATE bullet.
      #
      # WHY IT IS NOT FIRST. The token lint runs ahead of every `npm ci`
      # because token-scan.mjs is zero-dependency and `npm run` only
      # extends PATH. docs-gate.mjs imports `yaml` — the same package
      # lib/parser parses cards with, so a block parses for both or for
      # neither (T-057) — so it needs tools/e2e installed and CANNOT hold
      # that position. This is the earliest slot its own dependency allows,
      # and still ahead of the 250MB browser download. Do not "fix" it.
      #
      # Exit 0 clean, 1 the gate HAS a verdict, 2 called wrong, 3 the gate
      # could not run. The frozen EXIT object in the script owns those
      # numbers and nothing here re-types them.
      - name: docs gate (whole-tree half)
        working-directory: tools/e2e
        run: npm run lint:docs

      # T-045: CONVENTIONS lists `npm run typecheck` for tools/e2e and this
      # job never ran it — the hole that appears the moment the step list is
      # DERIVED from the doc instead of mirrored. Placed before the browser
      # download: it costs seconds, and a type error should not wait on
      # 250MB of Chromium.
      - name: e2e types
        working-directory: tools/e2e
        run: npm run typecheck

      # ---- capabilities census currency (T-153-s8) ---------------------
      # THE KEEPER docs/CAPABILITIES.md NEVER HAD. That file is GENERATED
      # from the test names in tools/e2e/tests/, and CLAUDE.md sends every
      # session to it first on the strength of its being generated — "a
      # sentence in it is false the moment its test reds and nobody keeps
      # it true by hand". The generation was real; the KEEPER was not.
      # Nothing in this job, in CONVENTIONS' command bullets, or in any
      # spec ever asked whether the committed bytes still matched a fresh
      # generation, so the census went stale, was regenerated by hand at a
      # checkpoint, and went stale again with nothing in between able to
      # say so. The occasions are enumerated on T-153-s8's card.
      #
      # WHY HERE, and every leg of it measured rather than assumed:
      #  - AFTER tools/e2e's `npm ci`. Not because the script imports a
      #    package — it imports none, and on an uninstalled worktree it
      #    ran and answered CURRENT — but because it resolves a templated
      #    test name's iterable by IMPORTING a `.mjs` out of tests/, and
      #    scripts there import `yaml`. The bare-checkout property is a
      #    fact about what the SPECS pull, so a spec edit could falsify it
      #    from three layers away. It cannot hold the token lint's seat.
      #  - AFTER `npm run typecheck`: the generator reads the same spec
      #    files tsc validates, and a file that does not compile should be
      #    named by the step that can say why.
      #  - BEFORE the 250MB browser download and the lane, by the same
      #    argument that puts `index --check` ahead of the audit: a stale
      #    census costs under a second to find out about.
      #
      # Exit 0 CURRENT, 1 STALE, 2 called wrong, 3 the gate could not run
      # — the script's own contract, re-typed nowhere. STALE fails this
      # job and its message names `npm run capabilities`, which is the
      # whole fix; a gate that COULD NOT RUN fails it too and says so in
      # those words, so the two are never read for each other.
      #
      # THE GENERATOR IS DELIBERATELY NOT A STEP. Run here it would
      # rewrite the very file this check judges, exit 0, and certify its
      # own output. The regeneration belongs in a commit — the SAME commit
      # as whatever moved a test name.
      #
      # AND NO CENSUS FIGURE APPEARS IN THIS FILE, which is the point of
      # having a step at all: a number transcribed beside a gate is the
      # thing with no keeper. Ask `npm run capabilities:check`.
      - name: capabilities census currency (docs/CAPABILITIES.md)
        working-directory: tools/e2e
        run: npm run capabilities:check

      - name: e2e browsers
        working-directory: tools/e2e
        run: npx playwright install --with-deps chromium
      - name: e2e lane
        working-directory: tools/e2e
        run: npm test

      # ---- xvfb tauri boot (LAST — the cargo cache above warms it) -----
      # WEBKIT_DISABLE_DMABUF_RENDERER: known webkit2gtk-in-headless-CI
      # rendering workaround; the check asserts startup lines, not pixels.
      # T-054 (T-045-s1): the xvfb WRAPPER is a real environment need — a
      # headless runner has no display — but what it wraps is now the
      # documented command rather than a second spelling of it. The script
      # resolves the repo root from import.meta.url, never process.cwd(),
      # so running it through npm from tools/e2e is behaviourally
      # identical to the old repo-root `node tools/e2e/scripts/…` form.
      - name: xvfb tauri boot
        working-directory: tools/e2e
        env:
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
        run: xvfb-run -a npm run boot:check
